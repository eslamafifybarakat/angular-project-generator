<div class="scrim" tabindex="-1" (click)="onScrim($event)" (keydown.escape)="closed.emit()">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="labelledBy()"
    [appFocusTrap]="true"
    (escaped)="closed.emit()"
  >
    <div class="modal__head">
      <h2 class="modal__title" [id]="labelledBy()">{{ heading() }}</h2>
      <button
        type="button"
        class="modal__close"
        [attr.aria-label]="'modal.close' | translate"
        (click)="closed.emit()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16">
          <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <ng-content />
  </div>
</div>
