<header class="bar">
  <a class="brand" [routerLink]="homeLink()" (click)="closeMenu()">
    <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)" />
      <path
        d="M9 22.5 16 8l7 14.5"
        fill="none"
        stroke="var(--accent-ink)"
        stroke-width="2.1"
        stroke-linejoin="round"
      />
      <path d="M12.2 18.6h7.6" stroke="var(--accent-ink)" stroke-width="2.1" stroke-linecap="round" />
    </svg>
    <span class="brand__text">
      <span class="brand__name">{{ 'angular_project_generator_app_app_name' | translate }}</span>
      <span class="brand__sub">{{ 'angular_project_generator_app_app_sub' | translate }}</span>
    </span>
  </a>

  <nav class="nav" [class.nav--open]="menuOpen()" [attr.aria-label]="'angular_project_generator_nav_menu' | translate">
    <a [routerLink]="homeLink()" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
      {{ 'angular_project_generator_nav_home' | translate }}
    </a>
    <a [routerLink]="newLink()" routerLinkActive="is-active" (click)="closeMenu()">
      {{ 'angular_project_generator_nav_new' | translate }}
    </a>
  </nav>

  <div class="bar__end">
    <label class="visually-hidden" for="lang-select">{{ 'angular_project_generator_app_lang_label' | translate }}</label>
    <app-dropdown
      class="bar__lang"
      dropdownId="lang-select"
      [compact]="true"
      [options]="languageOptions"
      [value]="language.lang()"
      (valueChange)="switchLanguage($event)"
    />

    <button
      type="button"
      class="btn btn--icon"
      [attr.aria-label]="themeLabelKey() | translate"
      (click)="theme.toggle()"
    >
      @if (theme.isDark()) {
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linejoin="round" />
        </svg>
      }
    </button>

    <button
      type="button"
      class="btn btn--icon bar__menu"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="'angular_project_generator_nav_menu' | translate"
      (click)="toggleMenu()"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round" />
      </svg>
    </button>
  </div>
</header>
