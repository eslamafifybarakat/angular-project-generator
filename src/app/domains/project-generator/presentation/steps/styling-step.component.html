<div class="group">
  <h2 class="group__head">{{ 'app.styH' | translate }}</h2>
  <div class="options">
    @for (language of languages; track language.value) {
      <button
        type="button"
        class="option"
        [disabled]="!language.available"
        [attr.aria-pressed]="language.available ? preprocessor() === language.value : null"
      >
        <span class="option__title">
          {{ language.label }}
          @if (!language.available) {
            <span class="badge badge--muted">{{ 'app.planned' | translate }}</span>
          }
        </span>
        <span class="option__desc">
          @if (language.available) {
            {{ 'app.scssD' | translate }}
          } @else {
            {{ 'app.archDisabledWhy' | translate }}
          }
        </span>
      </button>
    }
  </div>
</div>

<div class="group">
  <h2 class="group__head">{{ 'app.cssArchH' | translate }}</h2>
  <p class="group__sub">{{ 'app.cssArchD' | translate }}</p>
  <div class="options">
    @for (item of included; track item.titleKey) {
      <div class="panel--inset">
        <p class="option__title">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--ok)" stroke-width="2.4" aria-hidden="true">
            <path d="m20 6-11 11-5-5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          {{ item.titleKey | translate }}
        </p>
        <p class="option__desc">{{ item.bodyKey | translate }}</p>
      </div>
    }
  </div>
</div>
