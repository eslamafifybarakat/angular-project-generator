<div class="group">
  <div class="options">
    <button
      type="button"
      class="option"
      [attr.aria-pressed]="!includeExample()"
      (click)="set(false)"
    >
      <span class="option__title">{{ 'app.exNone' | translate }}</span>
      <span class="option__desc">{{ 'app.exNoneD' | translate }}</span>
    </button>
    <button
      type="button"
      class="option"
      [attr.aria-pressed]="includeExample()"
      (click)="set(true)"
    >
      <span class="option__title">{{ 'app.exMin' | translate }}</span>
      <span class="option__desc">{{ 'app.exMinD' | translate }}</span>
    </button>
  </div>
</div>

@if (includeExample()) {
  <div class="group">
    <h2 class="group__head">
      {{ 'app.exPreview' | translate }}
      <span class="badge badge--muted">{{ 'app.exLabel' | translate }}</span>
    </h2>

    <p class="hint" style="margin-bottom: 8px">
      <span class="mono ltr-run">src/app/app.component.ts</span>
    </p>
    <div class="code">
      <pre>&#64;Component(&#123; selector: 'app-root' &#125;)
export class AppComponent &#123; &#125;</pre>
    </div>

    <p class="hint" style="margin: 12px 0 8px">
      <span class="mono ltr-run">src/app/app.component.html</span>
    </p>
    <div class="code">
      <pre>@for (line of templateLines(); track line) {{{ line }}
}</pre>
    </div>
  </div>
}
